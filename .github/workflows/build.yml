name: Build APK

# Builds entirely on GitHub's cloud runners -- no Android Studio or SDK
# needed on your own device. Trigger it by pushing to main, or manually
# from the Actions tab (useful from the GitHub mobile app / mobile browser).
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-ide-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
