name: Build APK

# Builds entirely on GitHub's cloud runners -- no Flutter SDK or Android
# Studio needed on your own device. Trigger it by pushing to main, or
# manually from the Actions tab (works fine from the GitHub mobile app).
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-ide-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
